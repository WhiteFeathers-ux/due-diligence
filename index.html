add('i-roe','investor','Return and valuation','ratios',()=>{const e=int(10,40)*10000,rate=int(8,24,2),n=e*rate/100;return math(`Annual net income ${money(n)}, average equity ${money(e)}. Return on equity?`,rate,[[100/rate,'That reverses the intended return relationship.'],[rate/100,'That is the decimal form, not the percentage displayed here.'],[rate*2,'No doubling is justified by the annual inputs.']],`${money(n)} ÷ ${money(e)} × 100 = ${pct(rate)}.`,'High leverage or unusually small equity can make ROE look impressive without improving business quality.',pct,{inputs:{n,e}});});
add('i-pe','investor','Return and valuation','ratios',()=>{const eps=int(2,8),pe=int(7,22),price=eps*pe;return math(`Share price ${money(price)}, annual earnings per share ${money(eps)}. P/E?`,pe,[[eps/price,'This is earnings yield as a decimal, not price-to-earnings.'],[price,'Price alone ignores the earnings denominator.'],[price*eps,'Multiply is the wrong operation for this ratio.']],`${money(price)} ÷ ${money(eps)} = ${pe}×.`,'Check whether EPS is recurring and whether both comparison figures use trailing or forward earnings.',n=>num(n)+'×',{inputs:{price,eps}});});
add('i-peg','investor','Return and valuation','ratios',()=>{const g=int(10,25,5),pe=g*.8,g2=int(5,15,5),pe2=g2*1.6,flip=!!int(0,1);const a=flip?[pe2,g2]:[pe,g],b=flip?[pe,g]:[pe2,g2],win=flip?'B':'A';return item(`A: P/E ${num(a[0])}, expected EPS growth ${a[1]}%. B: P/E ${num(b[0])}, growth ${b[1]}%. Which is cheaper relative to growth by PEG?`,[opt(`${win}, with PEG 0.8`,'Its P/E divided by the growth percentage number is lower.'),opt(`${flip?'A':'B'}, with PEG 1.6`,'That is the higher PEG under the stated forecasts.'),opt('They have the same PEG','Their P/E-to-growth relationships differ.'),opt('Neither ratio can use percentages','PEG uses the growth percentage number, such as 20, not 0.20.')],`A has PEG ${num(a[0]/a[1])}; B has ${num(b[0]/b[1])}. Below 1 can suggest cheapness relative to forecast growth, but growth uncertainty and business risk can invalidate the apparent bargain.`);});
add('i-fcf','investor','Trends and cash quality','sec',()=>{const ocf=int(8,30)*10000,cap=int(3,7)*10000,ni=int(10,25)*10000;return math(`Net income ${money(ni)}, operating cash flow ${money(ocf)}, capital spending ${money(cap)}. Simple free cash flow?`,ocf-cap,[[ni,'Net income does not deduct cash capital spending in full.'],[ni-cap,'Start from operating cash flow, not net income.'],[ocf+cap,'Capital spending is a cash use and must be subtracted.']],`${money(ocf)} − ${money(cap)} = ${money(ocf-cap)}.`,'This simple FCF measure is not automatically the amount available for distribution after debt obligations.',money,{inputs:{ocf,cap}});});
add('i-inventory','investor','Working capital','target',()=>item(`Sales increased ${int(2,9)}%, but inventory increased ${int(30,65)}%. Which evidence is most useful before trusting the growth?`,[opt('Inventory aging, sell-through, and markdown exposure','These show whether the extra stock is likely to convert into cash at expected margins.'),opt('Only the warehouse’s square footage','Storage capacity does not establish demand or recoverable value.'),opt('Only reported gross profit','The current margin may not include the future cost of clearing excess stock.'),opt('Ignore it because inventory is an asset','An asset label does not guarantee full recovery or rapid conversion to cash.')],'Extra inventory can tie up cash and require markdowns when demand changes. Check seasonality and buying plans before deciding whether the increase is justified.'));
add('i-ar','investor','Working capital','bdc',()=>item(`Sales rise ${int(3,12)}%, while receivables rise ${int(35,70)}%. Which follow-up best tests the earnings?`,[opt('Check AR aging and subsequent customer receipts','Collection evidence tests whether recorded sales turn into cash.'),opt('Treat the extra AR as cash','AR is still a claim, not available bank funds.'),opt('Automatically double the earnings multiple','Slower cash conversion can increase risk rather than justify a premium.'),opt('Check only accounts payable','Supplier payment timing does not establish customer collection quality.')],'Receivables outrunning revenue can signal slow collections or revenue-quality problems. Confirm terms, seasonal timing, disputes, and receipts before relying on the balance.'));
add('i-pullforward','investor','Earnings quality','armour',()=>{const r=int(8,20)*100000,pull=r*.15;return item(`A wholesaler reports ${money(r)} quarterly sales, including ${money(pull)} shipped early from next quarter’s orders. Transfer criteria were met. What remains to investigate?`,[opt('Whether growth borrowed from future demand','Valid recognition and sustainable growth are different questions.'),opt('Every early shipment is automatically fraud','The stated transfer criteria were met; the concern is disclosure and repeatability.'),opt('The next quarter is guaranteed to grow','Moving orders earlier can leave a later shortfall.'),opt('Cash must equal the quarter’s revenue','Shipment timing does not prove collection.')],'Examine the order backlog, customer demand, and disclosure of timing effects. Pulling orders forward can make this quarter look stronger while weakening the next.');});
add('i-runway','investor','Cash runway','cake',()=>{const burn=int(10,40)*1000,weeks=int(5,18),cash=burn*weeks;return math(`A restaurant group has ${money(cash)} cash and burns ${money(burn)} per week. With no financing or change in burn, how long is its runway?`,weeks,[[cash*burn,'Multiply is not the relationship between cash and a weekly burn rate.'],[weeks*4,'The burn is already per week; multiplying by four overstates runway.'],[weeks/4,'The question asks for weeks, not approximate months.']],`${money(cash)} ÷ ${money(burn)} per week = ${weeks} weeks.`,'A claim of sustainability should be reconciled with the cash forecast and obligations.',n=>num(n)+' weeks',{inputs:{cash,burn}});});
add('i-oneoff','investor','Earnings quality','bdc',()=>{const total=int(15,35)*10000,gain=int(3,10)*10000;return math(`Reported pretax profit is ${money(total)}, including a ${money(gain)} one-time property-sale gain. Recurring pretax profit before other adjustments?`,total-gain,[[total,'A one-time disposal gain is not recurring operating earning power.'],[total+gain,'That double-counts the gain.'],[gain,'The gain is the item being removed, not what remains.']],`${money(total)} − ${money(gain)} = ${money(total-gain)}.`,'Normalize the earnings before applying a recurring-profit multiple.',money,{inputs:{total,gain}});});
add('i-coverage','investor','Debt coverage','bdc',()=>{const service=int(5,15)*10000,ratio=pick([.8,1.2,1.5,2]),cash=service*ratio;return math(`Using this lender’s definition, annual cash available for debt service is ${money(cash)} and principal plus interest is ${money(service)}. Coverage ratio?`,ratio,[[1/ratio,'That reverses available cash and required debt service.'],[ratio+1,'No extra one belongs in the coverage formula.'],[ratio*100,'Coverage is shown as a multiple here.']],`${money(cash)} ÷ ${money(service)} = ${num(ratio)}× coverage.`,'Below 1 means the stated cash is insufficient; use the lender’s exact definition and stress-test it.',n=>num(n)+'×',{inputs:{cash,service}});});
add('i-breakeven','investor','Break-even','bdc',()=>{const fixed=int(15,50)*1000,margin=pick([.25,.4,.5]);return math(`Monthly fixed operating costs are ${money(fixed)}. Contribution margin after variable costs is ${pct(margin*100)}. Operating break-even sales, before financing and tax?`,fixed/margin,[[fixed*margin,'Multiply understates sales needed to contribute enough dollars.'],[fixed,'Only part of each sales dollar covers fixed costs.'],[fixed/(1-margin),'That uses the variable-cost percentage, not contribution margin.']],`${money(fixed)} ÷ ${margin} = ${money(fixed/margin)} in monthly sales.`,'At this sales level contribution covers fixed operating costs, but financing, tax, and cash timing can still create needs.',money,{inputs:{fixed,margin}});});
add('i-concentration','investor','Customer risk','bdc',()=>item(`One customer provides ${int(65,95)}% of revenue and may terminate next month. What matters most?`,[opt('Contract durability, replacement demand, and the cash impact of loss','These determine whether earnings survive losing the concentrated account.'),opt('Only the number of small customers','Many tiny accounts may not offset one dominant customer.'),opt('Whether the customer has a recognizable logo','A famous customer can still cancel or negotiate lower prices.'),opt('The owner’s confidence alone','Confidence does not replace commitments and diversification evidence.')],'A large customer can control both sales and bargaining power. Model the loss before relying on the seller’s earnings or valuation.'));
add('i-markdown','investor','Working capital','target',()=>{const stock=int(4,20)*10000,recovery=pick([.5,.6,.7,.8]);return math(`Slow stock has book cost ${money(stock)}. Expected net proceeds after selling costs are ${money(stock*recovery)}. In this simplified recoverability exercise, what write-down is indicated?`,stock*(1-recovery),[[stock,'A full write-off ignores the stated recovery.'],[stock*recovery,'That is remaining recoverable value, not the reduction.'],[0,'Book cost exceeds the expected recovery in the stated facts.']],`${money(stock)} − ${money(stock*recovery)} = ${money(stock*(1-recovery))}.`,'Verify the inventory valuation rules and credible recovery evidence before treating old stock as full-value working capital.',money,{inputs:{stock,recovery}});});
add('l-base','lease','Rent math','lease',()=>{const area=int(10,30)*100,rate=int(20,40,2);return math(`A ${num(area)} sqft bakery is quoted ${money(rate)}/sqft/year base rent. Monthly base?`,area*rate/12,[[area*rate,'That is annual rent, not monthly rent.'],[rate*12,'This omits the floor area and converts in the wrong direction.'],[area*rate/10,'A year has twelve monthly payments, not ten.']],`${num(area)} × ${money(rate)} ÷ 12 = ${money(area*rate/12)} per month, rounded to the nearest dollar.`,'The quote is annual per square foot, not a monthly rate.',money,{inputs:{area,rate}});});
add('l-nnnmath','lease','Rent math','lease',()=>{const area=int(12,28)*100,base=int(20,36,2),nnn=int(5,12);return math(`Space: ${num(area)} sqft. Annual base ${money(base)}/sqft plus NNN ${money(nnn)}/sqft. Monthly base plus NNN?`,area*(base+nnn)/12,[[area*base/12,'This leaves out NNN charges.'],[area*(base+nnn),'This is the annual total.'],[area*base/12+nnn,'The NNN rate applies to all square feet, not once per month.']],`${num(area)} × (${money(base)} + ${money(nnn)}) ÷ 12 = ${money(area*(base+nnn)/12)}, rounded.`,'Separately billed utilities or other exclusions may increase total occupancy further.',money,{inputs:{area,base,nnn}});});
add('l-nnndef','lease','Lease structure','lease',()=>item('A broker advertises a triple-net lease. Which budget assumption is the sound starting point?',[opt('Base rent plus allocated taxes, insurance, and operating/maintenance charges','NNN typically passes these building costs to the tenant.'),opt('Base rent covers every building cost','That confuses NNN with a broad gross-rent arrangement.'),opt('Only the landlord’s income tax is passed through','Property taxes and landlord income tax are different obligations.'),opt('NNN estimates can never change','Estimates may reconcile to actual costs under the lease.')],'Read the charge definitions, exclusions, and caps. The label NNN is not a complete description of the tenant’s obligations.'));
add('l-gross','lease','Lease structure','lease',()=>item('A gross lease bundles base rent and specified building expenses. What must still be checked?',[opt('Exclusions, utilities, and expense escalation terms','A gross label does not tell whether all costs are fixed or included.'),opt('Nothing; the rent can never change','Escalation clauses can still apply.'),opt('Whether every charge must be paid twice','Bundled costs should not simply be added again.'),opt('Only the building’s paint color','Appearance does not establish the financial obligations.')],'Compare the actual included costs and future increases. A lower headline rate can be more expensive after exclusions.'));
add('l-ratio','lease','Occupancy economics','occupancy',()=>{const sales=int(40,120)*1000,r=pick([6,8,10,12,15]),cost=sales*r/100;return math(`Monthly total occupancy ${money(cost)}, monthly sales ${money(sales)}. Occupancy ratio?`,r,[[sales/cost,'That reverses costs and sales.'],[r/12,'Both figures already cover the same month.'],[r*12,'Annualizing both numerator and denominator leaves the ratio unchanged.']],`${money(cost)} ÷ ${money(sales)} × 100 = ${pct(r)}.`,'Use all costs in one consistent occupancy definition; assess the ratio against actual margins and local conditions.',pct,{inputs:{sales,cost}});});
add('l-band','lease','Occupancy economics','occupancy',()=>item(`A bakery’s occupancy ratio is ${pick([13,14,16])}% of projected sales, with thin margins. What does the game’s 12%+ warning suggest?`,[opt('Stress-test sales and renegotiate before committing','The fixed occupancy burden can leave too little room for other costs.'),opt('It proves the business must fail','A heuristic is not proof; economics and cost definitions vary.'),opt('Any rent is affordable if revenue grows','Projected growth may not materialize.'),opt('Exclude NNN to make the ratio look lower','Omitting real occupancy costs hides the commitment.')],'The requested 6–10% band is a rough screen, not a guaranteed healthy range. A high ratio deserves evidence and downside testing, especially before a long lease.'));
add('l-breakpoint','lease','Percentage rent','lease',()=>{const rate=pick([4,5,6,8]),breakpoint=int(5,18)*100000,base=breakpoint*rate/100;return math(`Annual base ${money(base)}; percentage rent ${rate}% above the natural breakpoint. Breakpoint?`,breakpoint,[[base*rate/100,'Multiply gives a fraction of the rent, not the sales breakpoint.'],[base/rate,'Convert the rate to a decimal before division.'],[base*12,'Base is already annual.']],`${money(base)} ÷ ${rate/100} = ${money(breakpoint)} annual sales.`,'Use the written breakpoint if the lease specifies one that differs from the natural calculation.',money,{inputs:{base,rate}});});
add('l-percentage','lease','Percentage rent','lease',()=>{const base=int(4,10)*10000,threshold=int(6,12)*100000,excess=int(1,5)*100000,rate=pick([4,5,6]);return math(`Annual base ${money(base)}, plus ${rate}% of sales above a stated ${money(threshold)} breakpoint. Sales ${money(threshold+excess)}. Annual rent before other costs?`,base+excess*rate/100,[[base+(threshold+excess)*rate/100,'Percentage rent applies only to the excess in this contract.'],[excess*rate/100,'That is additional percentage rent, omitting the base.'],[base,'Sales exceed the breakpoint, so additional rent applies.']],`${money(base)} + (${money(threshold+excess)} − ${money(threshold)}) × ${rate/100} = ${money(base+excess*rate/100)}.`,'Do not double-count percentage rent below the stated breakpoint.',money,{inputs:{base,threshold,excess,rate}});});
add('l-escalation','lease','Rent math','lease',()=>{const base=int(25,65)*100,rate=pick([2,3,4]),year=int(3,7),v=base*(1+rate/100)**(year-1);return math(`Year 1 rent ${money(base)}/month, rising ${rate}% at each anniversary. Monthly rent during year ${year}, nearest dollar?`,Math.round(v),[[Math.round(base*(1+rate/100)**year),'That applies one extra anniversary increase.'],[Math.round(base*(1+rate/100*(year-1))),'That adds simple increases rather than compounding them.'],[base,'Annual increases cannot be ignored.']],`${money(base)} × ${1+rate/100}^${year-1} = ${money(v)} rounded.`,'Year one is the starting rate, so year N has N minus one increases.',money,{inputs:{base,rate,year}});});
add('l-ti','lease','Buildout protection','ti',()=>{const area=int(12,25)*100,rate=int(20,50,5),cost=area*rate+int(20,70)*1000;return math(`Eligible buildout costs ${money(cost)}. The landlord reimburses ${money(rate)}/sqft for ${num(area)} sqft. What remains tenant-funded after reimbursement?`,cost-area*rate,[[cost,'That ignores the allowance after reimbursement.'],[area*rate,'That is the allowance, not the remaining tenant-funded amount.'],[cost+area*rate,'The reimbursement reduces, rather than increases, net cost.']],`${money(cost)} − (${num(area)} × ${money(rate)}) = ${money(cost-area*rate)}.`,'The tenant may still need to finance the full initial payment until reimbursement conditions are met.',money,{inputs:{cost,area,rate}});});
add('l-guarantee','lease','Personal exposure','lease',()=>item('The company signs a lease and the owner signs a separate personal guarantee. What deserves review?',[opt('The guarantee’s scope, cap, duration, and release conditions','Personal obligations may survive the business’s inability to pay.'),opt('Only the company’s limited-liability label','That label does not erase a separately signed personal obligation.'),opt('Only this month’s rent','Future rent, damages, or other costs may be included.'),opt('Nothing, because guarantees are never enforced','Enforcement depends on the terms and applicable law, not this assumption.')],'A personal guarantee can expose the signer beyond the company’s assets. Review the actual language and negotiate limitations before relying on entity protection.'));
add('l-compare','lease','Lease structure','lease',()=>{const base=int(22,32),charges=int(6,10),gross=base+charges-pick([2,3,4]),area=int(12,25)*100;return math(`Matched inclusions: ${money(gross)}/sqft/year gross versus ${money(base)} base + ${money(charges)} NNN for ${num(area)} sqft. Annual savings with gross?`,(base+charges-gross)*area,[[Math.abs(gross-base)*area,'Comparing only base rates leaves out NNN.'],[(base+charges-gross)*area/12,'That is monthly savings, not annual savings.'],[0,'The matched totals differ.']],`(${money(base+charges)} − ${money(gross)}) × ${num(area)} = ${money((base+charges-gross)*area)} annually.`,'Match costs first, then compare future escalations and exclusions.',money,{inputs:{base,charges,gross,area}});});
add('l-renewal','lease','Buildout protection','ti',()=>item(`A bakery invests ${money(int(10,40)*10000)} in a leased kitchen. The lease ends before the investment is expected to pay back. What most directly protects continued use?`,[opt('An enforceable tenant renewal option with workable conditions','This gives a defined route to continue occupying the space.'),opt('A verbal statement that renewal should be fine','Goodwill does not create the same documented right.'),opt('A larger logo on the storefront','Branding cannot extend the legal term.'),opt('Assuming renovation creates ownership','Improvements to rented premises do not automatically make the tenant the owner.')],'Review notice timing, default conditions, transfer rights, and renewal pricing. An option that cannot be exercised affordably or transferred with the business may provide little protection.'));
add('l-sales','lease','Occupancy economics','occupancy',()=>{const cost=int(5,12)*12000,ratio=pick([6,8,10]);return math(`Total annual occupancy is ${money(cost)}. What sales support a ${ratio}% occupancy ratio?`,cost/(ratio/100),[[cost*ratio/100,'Multiply does not solve for the sales denominator.'],[cost/ratio,'The percent must be converted to a decimal.'],[cost*12,'The occupancy amount is already annual.']],`${money(cost)} ÷ ${ratio/100} = ${money(cost/(ratio/100))} sales, rounded.`,'Evaluate whether conservative sales evidence can support that volume.',money,{inputs:{cost,ratio}});});
add('l-cam','lease','Lease structure','lease',()=>{const est=int(5,12)*1000,actual=est+int(2,8)*1000;return math(`The lease requires an annual CAM true-up. The tenant paid ${money(est)} in estimates; its verified allocated actual cost is ${money(actual)}. Extra amount due?`,actual-est,[[actual,'The estimates already paid must be credited.'],[est,'That is what was already paid, not the balance.'],[0,'An estimate is not a cap under these stated terms.']],`${money(actual)} − ${money(est)} = ${money(actual-est)}.`,'Inspect allocations, exclusions, and supporting invoices rather than assuming every billed item is permitted.',money,{inputs:{est,actual}});});
add('l-oral','lease','Contract evidence','rock',()=>item('A landlord verbally agrees to defer rent. The written agreement requires signed written changes, and none has been signed. What is the prudent budgeting decision?',[opt('Keep the original obligation in the budget until the change is documented','The alleged variation is not yet dependable for planning.'),opt('Remove the rent permanently','Deferral is not forgiveness, and the change is not documented.'),opt('Assume every oral promise is enforceable everywhere','Formalities and local law matter.'),opt('Stop communicating with the landlord','Clarifying and documenting the agreement is the useful next step.')],'Obtain a signed amendment matching the intended concession and review its effect. The documented English office-licence dispute illustrates the risk, but local law and contract language control each case.'));
add('l-breakrefund','lease','Contract evidence','marks',()=>item('A tenant expects an automatic refund of advance rent after using a mid-quarter break option. The lease does not clearly promise a refund. What should the cash forecast assume?',[opt('Do not rely on the refund until the right is verified','An assumed refund could create a cash shortfall.'),opt('A prorated refund is guaranteed everywhere','The result depends on the contract and jurisdiction.'),opt('The break automatically refunds the entire quarter','Occupation before the break also had a cost.'),opt('Rent and service charges must always be treated identically','Separate clauses can create different rights for each payment.')],'Read the refund terms for each charge and obtain advice before counting the cash. The M&S English lease dispute shows why fairness alone may not supply a missing refund term.'));
add('l-delay','lease','Buildout protection','ti',()=>{const rent=int(3,8)*1000,months=int(2,5);return math(`Rent starts before opening. A permit delay adds ${months} months at ${money(rent)}/month, with no relief. Added base-rent cash needed?`,rent*months,[[rent,'That funds one delayed month only.'],[rent/months,'Multiply monthly cost by months of delay.'],[0,'Rent starts before opening under the stated contract.']],`${months} × ${money(rent)} = ${money(rent*months)} extra base rent.`,'Budget separately for utilities, payroll, and construction overruns; negotiate commencement and permitting protections early.',money,{inputs:{rent,months}});});
add('l-stress','lease','Occupancy economics','occupancy',()=>{const sales=int(60,100)*1000,cost=sales*.08,drop=pick([20,25,40]);return math(`Occupancy costs ${money(cost)}/month on ${money(sales)} sales. If sales fall ${drop}% and occupancy is fixed, new ratio?`,cost/(sales*(1-drop/100))*100,[[8,'The cost stays fixed but sales fall, so the ratio rises.'],[8*(1-drop/100),'That incorrectly makes occupancy fall in step with sales.'],[drop,'The sales decline is not the occupancy ratio.']],`${money(cost)} ÷ ${money(sales*(1-drop/100))} × 100 = ${pct(cost/(sales*(1-drop/100))*100)}.`,'Fixed occupancy magnifies downside when sales weaken.',pct,{inputs:{sales,cost,drop}});});
add('l-use','lease','Contract evidence','lease',()=>item('The space is advertised as ideal for a bakery, but permitted use, ventilation approvals, and landlord consent for a hood remain unverified. Best next step?',[opt('Verify permissions and conditions before an unconditional commitment','The business model depends on legally and physically operating the kitchen.'),opt('Sign because the listing says bakery','Marketing language is not the necessary permit or contractual permission.'),opt('Assume the previous tenant’s approval transfers automatically','A new use or operator may face different conditions.'),opt('Ignore the kitchen because base rent is low','Low rent does not fix a space that cannot support the intended operation.')],'Confirm the lease use clause, building requirements, and approvals for the planned operation. Make the commitment depend on resolving essential conditions rather than hoping they will work out.'));
function verdict(prompt,correct,reasons,note,stats,explanation,extra={}){return item(prompt,[opt(correct,reasons[correct]),...['Invest','Investigate','Pass'].filter(x=>x!==correct).map(x=>opt(x,reasons[x]))],explanation,{note,stats,...extra});}
function caseStats({revenue,net=10,gross=40,customer=8,occupancy=6,debt=50000,days=25}){return [['Annual revenue',money(revenue)],['Gross / net margin',`${gross}% / ${net}%`],['Largest customer',customer+'% of sales'],['Occupancy / sales',occupancy+'%'],['Interest-bearing debt',money(debt)],['AR days',days+' days']];}
add('v-owner','verdict','Earnings quality','bdc',()=>{const rev=int(8,18)*100000,salary=int(7,12)*10000,profit=rev*.12,verified=!!int(0,1);return verdict('The owner-operated shop: what does the evidence support?',verified?'Invest':'Investigate',verified?{Invest:'Replacement management is already costed, earnings are verified, and the price is supported.',Investigate:'The case explicitly says the labor, cash, valuation, and contract checks are complete.',Pass:'There is no stated unresolved deal-breaking risk at the reviewed price.'}:{Invest:'The asking price relies on profit that omits necessary labor.',Investigate:'Normalize the missing salary and reassess the price before committing.',Pass:'Missing evidence can be resolved; the facts do not yet establish an unacceptable deal.'},verified?`Independent diligence confirms 12% net AFTER ${money(salary)} market-rate management pay, recurring cash flow, sound equipment and contracts. A ${money(profit*4)} equity price (4× net income) and funding are supported.`:`Reported profit omits a full-time owner’s ${money(salary)} replacement cost. The price assumes that labor is free; normalized results have not been supplied.`,caseStats({revenue:rev,net:12}),verified?'The deciding factor is verified recurring earnings after paying for required labor at a supported price. Owner operation itself is not a reason to reject a sound business.':`Before tax adjustments, ${money(profit)} reported profit falls to ${money(profit-salary)} after replacement labor. Investigate that economic difference rather than valuing unpaid work as free profit.`);});
add('v-customer','verdict','Customer risk','bdc',()=>{const rev=int(20,55)*100000,share=int(85,95),days=pick([75,90,105]);return verdict('The dependent distributor: accept the current deal?', 'Pass',{Invest:'The concentrated, cancellable account and long collections create an unprotected cash and revenue risk.',Investigate:'The adverse contract facts are already verified, and the seller refuses mitigation or a price change.',Pass:'The verified concentration and liquidity exposure are unacceptable on these stated terms.'},`One customer produces ${share}% of sales, may cancel in 30 days, and pays slowly. Verified records show no committed replacement business or liquidity facility. The seller refuses protection or repricing.`,caseStats({revenue:rev,net:4,gross:18,customer:share,days,debt:rev*.25,occupancy:2}),'Pass on the current terms because the dominant customer can disappear before the cash cycle completes. A different structure or price might change the decision, but neither is offered here.');});
add('v-startup','verdict','Occupancy economics','occupancy',()=>{const sales=int(5,9)*100000,ratio=pick([14,15,16]);return verdict('The new bakery: commit on the proposed terms?','Pass',{Invest:'The forecast is unproven and the fixed occupancy burden is already high.',Investigate:'Essential history is absent and the offered terms remain unaffordable in the stated downside test.',Pass:'Reject or renegotiate the commitment before investing.'},`${money(sales)} is a sales forecast, not operating history. Annual occupancy is ${money(sales*ratio/100)} with a long lease and uncapped personal guarantee; a 20% sales downside cannot be funded.`,caseStats({revenue:sales,net:8,gross:65,customer:0,occupancy:ratio,debt:180000,days:0}),'Pass means pass or renegotiate these terms. The deciding factor is a large fixed commitment against unproven sales with no funded downside, not simply that the business is new.',{statsLabel:'Projected statement · no operating history'});});
add('v-machine','verdict','Return and valuation','bdc',()=>{const rev=int(12,35)*100000,net=pick([14,16,18]),p=rev*net/100,price=p*pick([3,4]);return verdict('The established machine shop: what does the evidence support?','Invest',{Invest:'Verified earnings, customer diversity, low debt, and a supported price justify the case.',Investigate:'The price, recurring earnings, contracts, equipment, and financing have already been independently checked.',Pass:'A boring business is not a bad business; no disqualifying fact is supplied.'},`Three stable years, market-rate management pay included, and cash flow supports earnings. Independent diligence confirms equipment, contracts, and funding. The ${money(price)} equity price is supported after debt and capital needs.`,caseStats({revenue:rev,net,gross:38,customer:8,occupancy:4,debt:60000,days:28}),'Invest at the reviewed price because the recurring economics and essential evidence are in place. A high margin alone would not justify the same decision.');});
add('v-collections','verdict','Working capital','bdc',()=>{const rev=int(15,40)*100000,resolved=!!int(0,1);return verdict('The wholesaler with a receivables spike: best next step?',resolved?'Invest':'Investigate',resolved?{Invest:'The timing issue has been tested against receipts and the overall deal is supported.',Investigate:'The case says the collection uncertainty and broader diligence are resolved.',Pass:'A resolved timing effect is not the same as permanent uncollectible revenue.'}:{Invest:'The reported profit lacks collection evidence.',Investigate:'AR aging and subsequent receipts could resolve the discrepancy.',Pass:'The current facts raise a question but do not establish unrecoverable balances.'},resolved?'AR rose faster than sales at year-end. Subsequent bank receipts confirm collection in full under agreed seasonal terms. Independent review supports normalized cash flow, fair price, contracts, equipment, and funding.':'AR grew 45% while sales rose 8%; collection days doubled. Operating cash flow is negative, and aging reports and subsequent receipts have not been provided.',caseStats({revenue:rev,net:7,gross:24,customer:12,occupancy:3,debt:250000,days:resolved?35:70}),resolved?'Evidence can change the verdict: verified subsequent collections explain the temporary AR spike. With the remaining diligence and price supported, the warning has been resolved.':'Investigate whether rising AR reflects timing, disputes, or aggressive sales recognition. Profit unsupported by collections should not be accepted at face value.');});
add('v-inventory','verdict','Working capital','target',()=>{const rev=int(10,25)*100000,written=!!int(0,1);return verdict('The retailer carrying excess stock: what now?',written?'Invest':'Investigate',written?{Invest:'The markdown loss is recognized, obsolete stock is excluded from the price, and the remaining business is verified.',Investigate:'The specific inventory uncertainty and remaining diligence are explicitly resolved.',Pass:'Past overstock does not disqualify a repriced, verified business forever.'}:{Invest:'Unreviewed aged stock can inflate both earnings and acquisition working capital.',Investigate:'Establish recovery value and required markdowns before accepting the price.',Pass:'Excess stock may be manageable after valuation and repricing; evidence is still missing.'},written?'A completed stock count and sell-through review identified obsolete goods. The write-down is recorded and the purchase price excludes those goods; independent review supports recurring margins, contracts, financing and the revised valuation.':'Stock is up 50%, sales up 5%. The seller values all inventory at cost, but stock aging and markdown forecasts are missing.',caseStats({revenue:rev,net:6,gross:30,customer:5,occupancy:7,debt:100000,days:5}),written?'Invest at the reviewed, revised price because the known stock loss has been recognized and allocated. The deciding factor is resolution of the risk, not pretending the overstock never happened.':'Investigate realizable inventory value and the cash needed to clear excess stock. A growing asset balance is not proof of growing value.');});
add('v-runway','verdict','Cash runway','cake',()=>{const burn=int(15,40)*1000,weeks=int(4,9),cash=burn*weeks;return verdict('The restaurant described as sustainable: commit now?','Pass',{Invest:'The cash forecast contradicts an adequately funded business.',Investigate:'The short runway and absence of funding are verified; this is not just a missing document.',Pass:'The business cannot fund the stated plan on the offered terms.'},`Cash is ${money(cash)} and weekly net burn is ${money(burn)}. Only ${weeks} weeks remain; no financing is committed and the seller requires closing without new capital. The forecast already includes rent and debt payments.`,caseStats({revenue:int(10,25)*100000,net:-4,gross:58,customer:4,occupancy:12,debt:300000,days:3}),'Pass on these terms because the verified cash runway cannot support the operating plan. Describing stores as sustainable does not replace an adequately funded cash forecast.');});
add('v-rebate','verdict','Earnings quality','kraft',()=>{const rev=int(20,45)*100000,rebate=int(4,12)*10000;return verdict('The food processor’s sudden margin improvement: best next step?','Investigate',{Invest:'The apparent savings depend on unsupported rebate recognition.',Investigate:'Verify the signed rebate terms and accounting before trusting the margin.',Pass:'The facts establish an unresolved issue, not yet the corrected economics or the seller’s response.'},`Reported profit includes ${money(rebate)} of supplier rebates. Purchase thresholds may not have been met, and supplier confirmations are missing. The seller has agreed to supply the contracts.`,caseStats({revenue:rev,net:9,gross:28,customer:15,occupancy:3,debt:200000,days:40}),'Investigate the recognition criteria and normalize any unearned rebate. The deciding factor is support for the cost reduction, not the size of the reported margin.');});
add('v-pullforward','verdict','Earnings quality','armour',()=>verdict('The supplier with a record quarter: trust the growth multiple?','Investigate',{Invest:'The growth may reflect order timing rather than new demand.',Investigate:'Review the backlog, timing effects, and sustainable run rate before valuation.',Pass:'Early shipments with valid transfer terms do not alone prove the deal is unsalvageable.'},`${int(12,22)}% of this quarter’s revenue came from orders originally scheduled next quarter. Shipment/transfer conditions were satisfied, but management has not separated timing from new demand.`,caseStats({revenue:int(20,50)*100000,net:8,gross:32,customer:14,occupancy:3,debt:150000,days:45}),'Investigate recurring demand before paying for headline growth. The lesson is earnings quality and disclosure, not that every early shipment is improper.'));
add('v-leasepaper','verdict','Contract evidence','rock',()=>verdict('The bakery acquisition depends on a promised rent concession. Commit now?','Investigate',{Invest:'The savings exist only in an unconfirmed oral promise.',Investigate:'Obtain a valid documented amendment and recalculate the deal.',Pass:'The documentation may be resolved before committing, and the parties have not refused.'},`The seller’s profit forecast assumes ${money(int(1,3)*1000)} monthly rent relief. The lease requires signed amendments; the concession is verbal only, and the landlord has agreed to discuss it.`,caseStats({revenue:int(8,15)*100000,net:10,gross:63,customer:5,occupancy:9,debt:40000,days:3}),'Investigate the enforceable written terms before valuing the concession. A forecast that depends on a promise needs evidence of that promise’s actual effect.'));
add('v-oven','verdict','Capital spending','worldcom',()=>{const rev=int(10,25)*100000;return verdict('The service company’s improved profit: what now?','Investigate',{Invest:'Unsupported capitalization can make recurring costs disappear from the P&L.',Investigate:'Trace the asset entries and restate maintainable earnings before valuation.',Pass:'The entries need review and correction; the seller has not refused access or a revised price.'},`${money(int(4,10)*10000)} of routine consumed services were booked as equipment. There are no related physical assets or documented future benefits; the seller permits a full accounting review and repricing.`,caseStats({revenue:rev,net:16,gross:45,customer:9,occupancy:5,debt:60000,days:30}),'Investigate and correct the unsupported assets and inflated earnings. Willingness to review and reprice keeps this an unresolved diligence question rather than an automatic investment.');});
add('v-bakery','verdict','Buildout protection','ti',()=>{const rev=int(8,16)*100000;return verdict('The bakery after lease and equipment review: what does the evidence support?','Invest',{Invest:'The verified economics and documented tenure support the reviewed price.',Investigate:'The material lease, equipment, cash-flow, and price checks have been completed.',Pass:'No stated unresolved risk outweighs the verified economics at this price.'},`Four years of steady sales; market-rate manager pay included. A transferable renewal option has affordable documented pricing. Independent review confirms equipment, cash flow, contracts and financing, and supports the ${money(rev*.1*4)} equity price.`,caseStats({revenue:rev,net:10,gross:64,customer:4,occupancy:7,debt:30000,days:4}),'Invest at the supported price because earnings and continued occupancy are verified. The renewal right protects the use of the buildout only because its terms are workable.');});
const research=JSON.parse(document.getElementById('research-data').textContent);
for(const entry of research.cases){const source='research-'+entry.id;SOURCES[source]=entry.source;add(entry.id,entry.mode,entry.concept,source,()=>item(entry.prompt,entry.choices.map(c=>opt(c.text,c.why)),entry.explanation,{note:entry.note,stats:entry.stats,caseType:entry.caseType,statsLabel:entry.caseType==='Historical case'?'Documented case facts':'Fictional practice facts'}));}
const KEY='due-diligence-v1',BATCH=10;
const blank=()=>({schema:2,xp:0,modes:{},sessions:{}});
const safeInt=n=>Number.isSafeInteger(n)&&n>=0?n:0;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const app=document.getElementById('app');let saved=blank(),storageOK=true,active=null,view='home';
function freshProgress(){return {answered:0,correct:0,bestStreak:0,bestTen:0,checkpoints:0,concepts:{},recent:[],deck:[],legacy:null};}
function validQuestion(q){return q&&typeof q.prompt==='string'&&q.prompt.length<2000&&typeof q.explanation==='string'&&typeof q.id==='string'&&bank.some(t=>t.id===q.id)&&SOURCES[q.source]&&Array.isArray(q.choices)&&q.choices.length>=3&&q.choices.length<=4&&q.choices.every(o=>typeof o.text==='string'&&typeof o.why==='string'&&typeof o.correct==='boolean')&&q.choices.filter(o=>o.correct).length===1;}
function readSave(){try{const raw=localStorage.getItem(KEY);if(!raw)return;const p=JSON.parse(raw);if(!p||typeof p!=='object')return;saved.xp=safeInt(p.xp);for(const m of modes){const old=p.modes&&p.modes[m.id];const s=freshProgress();if(old&&p.schema===2){for(const k of ['answered','correct','bestStreak','bestTen','checkpoints'])s[k]=safeInt(old[k]);s.correct=Math.min(s.correct,s.answered);s.bestTen=Math.min(10,s.bestTen);s.legacy=old.legacy&&{best:Math.min(m.legacyTotal,safeInt(old.legacy.best)),completed:safeInt(old.legacy.completed)};for(const concept of new Set(bank.filter(t=>t.mode===m.id).map(t=>t.concept))){const c=old.concepts&&old.concepts[concept];if(c)s.concepts[concept]={answered:safeInt(c.answered),correct:Math.min(safeInt(c.correct),safeInt(c.answered))};}s.recent=Array.isArray(old.recent)?old.recent.filter(x=>typeof x==='string').slice(-80):[];s.deck=Array.isArray(old.deck)?old.deck.filter(id=>bank.some(t=>t.id===id&&t.mode===m.id)):[];}else if(old){s.legacy={best:Math.min(m.legacyTotal,safeInt(old.best)),completed:safeInt(old.completed)};}saved.modes[m.id]=s;const r=p.sessions&&p.sessions[m.id];if(p.schema===2&&r&&r.mode===m.id&&Array.isArray(r.batch)&&r.batch.length<=10&&r.batch.every(a=>validQuestion(a.q)&&Number.isInteger(a.choice)&&a.choice>=0&&a.choice<a.q.choices.length)&&validQuestion(r.current)&&r.current.mode===m.id){r.total=safeInt(r.total);r.correct=Math.min(r.total,safeInt(r.correct));r.streak=safeInt(r.streak);r.bestStreak=safeInt(r.bestStreak);r.chosen=Number.isInteger(r.chosen)&&r.chosen>=0&&r.chosen<r.current.choices.length?r.chosen:null;r.checkpoint=r.checkpoint===true&&r.batch.length>0;r.recentIds=Array.isArray(r.recentIds)?r.recentIds.filter(id=>typeof id==='string').slice(-4):[];saved.sessions[m.id]=r;}}}catch(e){storageOK=false;}}
function stats(mode){return saved.modes[mode]||(saved.modes[mode]=freshProgress());}
function sync(){try{localStorage.setItem(KEY,JSON.stringify(saved));storageOK=true;}catch(e){storageOK=false;}chrome();}
function chrome(){document.getElementById('xp').textContent=saved.xp.toLocaleString()+' XP';document.getElementById('storage').classList.toggle('hidden',storageOK);document.getElementById('save-status').textContent=storageOK?'Saved in this browser':'Session only; storage unavailable';}
function focusMain(){window.scrollTo(0,0);app.focus({preventScroll:true});}
function sourceHTML(q){const s=SOURCES[q.source];return `<details class="source-note"><summary>Research behind this question</summary><p><strong>${esc(s.kind)}</strong></p><p>${esc(s.note)}</p><p><a href="${esc(s.url)}" target="_blank" rel="noopener noreferrer">${esc(s.title)}</a> · opens online</p></details>`;}
function weak(mode){return Object.entries(stats(mode).concepts).filter(([,v])=>v.answered>=2&&v.correct<v.answered).sort((a,b)=>(a[1].correct/a[1].answered)-(b[1].correct/b[1].answered));}
function createQuestion(mode,r){const s=stats(mode),pool=bank.filter(t=>t.mode===mode);if(!s.deck.length)s.deck=shuffle(pool.map(t=>t.id));let id;const weaknesses=weak(mode);if(r.total>0&&r.total%4===0&&weaknesses.length){const candidates=pool.filter(t=>t.concept===weaknesses[0][0]&&!r.recentIds.includes(t.id));if(candidates.length)id=pick(candidates).id;}if(!id){const at=s.deck.findIndex(x=>!r.recentIds.includes(x));id=s.deck.splice(at<0?0:at,1)[0];}const template=pool.find(t=>t.id===id);let question;for(let tries=0;tries<20;tries++){question={...template.make(),id,mode,concept:template.concept,source:template.source};if(!s.recent.includes(question.prompt))break;}question.choices=shuffle(question.choices);question.caseType=question.caseType||(SOURCES[template.source].kind.startsWith('Historical')||SOURCES[template.source].kind.startsWith('Documented')?'Adapted from a documented case':'Research-informed practice');s.recent.push(question.prompt);s.recent=s.recent.slice(-80);r.recentIds.push(id);r.recentIds=r.recentIds.slice(-4);return question;}
function home(){active=null;view='home';chrome();const total=modes.reduce((n,m)=>n+stats(m.id).answered,0);app.innerHTML=`<section class="intro"><h1>Better questions.<br>Better decisions.</h1><p class="muted">Continuous practice built around business evidence. New numbers, changing facts, and a clear reason behind every answer.</p><div class="overview"><div><strong>${total.toLocaleString()}</strong><span class="muted">answered</span></div><div><strong>${bank.length}</strong><span class="muted">study patterns</span></div><div><strong>No limit</strong><span class="muted">keep practicing</span></div></div></section><nav class="modes" aria-label="Practice modes">${modes.map(m=>{const s=stats(m.id),r=saved.sessions[m.id],w=weak(m.id);return `<button class="mode" data-mode="${m.id}"><span><span class="mode-title">${m.name}</span><span class="mode-desc">${m.desc}</span><span class="mode-meta"><span>${s.answered?Math.round(s.correct/s.answered*100)+'% accuracy':'No answers yet'}</span><span>Best 10: ${s.checkpoints?s.bestTen+'/10':'—'}</span><span>${s.checkpoints} checkpoints</span></span>${w.length?`<span class="mode-desc">Practice next: ${esc(w[0][0])}</span>`:''}${s.legacy?.completed?`<span class="mode-desc legacy">Original edition best ${s.legacy.best}/${m.legacyTotal} preserved</span>`:''}</span><span class="start">${r?'Resume · '+r.total+' answered':'Start practice'} →</span></button>`;}).join('')}</nav><div class="foot"><p>Pause any time. Progress saves after every answer. Every 10 answers brings a checkpoint, then keep going.</p><p>Research checked: <strong>${esc(research.checkedAt.slice(0,10))}</strong> · ${research.cases.length} research cases in this edition.</p><details><summary>How the research and practice work</summary><p>Documented events and primary-source guidance shape the lessons. “Historical case” uses reported facts; “Adapted” uses invented businesses or numbers to practice a documented lesson. Other questions teach researched fundamentals.</p><p>Numbers and decision-changing facts vary. Study patterns and historical cases eventually recur; this is continuous practice, not an infinite supply of unique real events. Missed concepts return more often.</p><p>Daily research updates publish a new edition when the research runner is available online. On the mobile website, reload to get the latest published edition. Downloaded or shared files need a refreshed copy. The date above identifies this edition, not a live connection.</p><p>10 XP per correct answer. Best 10 scores use full checkpoints; partial sessions still count toward accuracy. All explanations work offline; source links need internet.</p><p>The 6–10% occupancy band and 12%+ warning are screening heuristics. Invest means the fictional evidence and reviewed price support a deal; Investigate means key evidence is missing; Pass means reject the offered terms.</p></details><details><summary>Research library</summary>${Object.values(SOURCES).filter((s,i,a)=>a.findIndex(x=>x.url===s.url)===i).map(s=>`<p><a href="${esc(s.url)}" target="_blank" rel="noopener noreferrer">${esc(s.title)}</a><br>${esc(s.kind)}</p>`).join('')}</details></div>`;app.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>start(b.dataset.mode));focusMain();}
function start(mode){let r=saved.sessions[mode];if(!r){r={mode,total:0,correct:0,streak:0,bestStreak:0,batch:[],current:null,chosen:null,checkpoint:false,recentIds:[]};r.current=createQuestion(mode,r);saved.sessions[mode]=r;}active=r;sync();if(r.checkpoint)checkpoint();else renderQuestion();}
function header(r){const m=modes.find(m=>m.id===r.mode);return `<div class="toolbar"><button class="text-button" id="pause">Pause & modes</button><span class="muted">${esc(m.name)}</span></div><div class="quiz-meta"><span>Question ${r.total+(r.chosen===null?1:0)} · continuous practice</span><span>${r.correct}/${r.total} correct · Streak ${r.streak}</span></div><div class="checkpoint-line"><span>${r.batch.length} / 10 to checkpoint</span><span>${esc(r.current.concept)}</span></div><div class="progress" role="progressbar" aria-label="Answers toward checkpoint" aria-valuemin="0" aria-valuemax="10" aria-valuenow="${r.batch.length}"><span style="width:${r.batch.length*10}%"></span></div>`;}
function statement(q){return q.stats&&q.stats.length?`<div class="statement"><table><caption>${esc(q.statsLabel||'Statement excerpt · fictional practice')}</caption><tbody>${q.stats.map(([k,v])=>`<tr><th scope="row">${esc(k)}</th><td>${esc(v)}</td></tr>`).join('')}</tbody></table>${q.note?`<p class="case-note">${esc(q.note)}</p>`:''}</div>`:q.note?`<p class="case-note standalone">${esc(q.note)}</p>`:'';}
function renderQuestion(){const r=active,q=r.current;view='question';app.innerHTML=header(r)+`<div class="workspace ${q.stats?.length?'has-statement':''}"><div class="question-side"><section class="question"><h2 id="question">${esc(q.prompt)}</h2><p class="concept">${esc(q.caseType)}</p></section>${statement(q)}</div><div class="answer-side"><div id="answer-area"></div></div></div>`;document.getElementById('pause').onclick=()=>{sync();home();};if(r.chosen===null){document.getElementById('answer-area').innerHTML=`<div class="answers" role="group" aria-labelledby="question">${q.choices.map((o,i)=>`<button class="answer" data-choice="${i}"><span class="letter" aria-hidden="true">${i+1}</span><span>${esc(o.text)}</span></button>`).join('')}</div><p class="input-note muted">Choose one answer. <span class="desktop-hint">Keys 1–${q.choices.length} also work.</span></p><button class="text-button" id="finish">Finish & review</button>`;app.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>answer(Number(b.dataset.choice)));document.getElementById('finish').onclick=()=>checkpoint(true);}else feedback();focusMain();}
function answer(index){const r=active;if(!r||view!=='question'||r.chosen!==null)return;const q=r.current,c=q.choices[index];if(!c)return;r.chosen=index;r.total++;if(c.correct){r.correct++;r.streak++;saved.xp+=10;}else r.streak=0;r.bestStreak=Math.max(r.bestStreak,r.streak);r.batch.push({q,choice:index});const s=stats(r.mode);s.answered++;if(c.correct)s.correct++;s.bestStreak=Math.max(s.bestStreak,r.streak);const concept=s.concepts[q.concept]||(s.concepts[q.concept]={answered:0,correct:0});concept.answered++;if(c.correct)concept.correct++;if(r.batch.length===BATCH){s.checkpoints++;s.bestTen=Math.max(s.bestTen,r.batch.filter(a=>a.q.choices[a.choice].correct).length);}sync();renderQuestion();document.getElementById('answer-area').scrollIntoView({block:'start',behavior:'auto'});document.getElementById('next').focus({preventScroll:true});}
function feedback(){const r=active,q=r.current,c=q.choices[r.chosen],right=q.choices.find(o=>o.correct);document.getElementById('answer-area').innerHTML=`<section class="feedback ${c.correct?'':'wrong'}" role="status" aria-live="polite"><h3>${c.correct?'Correct. +10 XP':'Not quite.'}</h3><p class="selected-answer"><strong>Selected:</strong> ${esc(c.text)}</p><p>${esc(c.why)}</p>${c.correct?'':`<p class="correct-text"><strong>Correct answer:</strong> ${esc(right.text)}</p>`}<p>${esc(q.explanation)}</p></section><div class="actions next-actions"><button class="primary" id="next">${r.batch.length===BATCH?'View checkpoint':'Next question'}</button><button class="secondary" id="finish">Finish & review</button></div><details class="choice-review"><summary>Why each answer is right or wrong</summary>${q.choices.map(o=>`<div class="reason"><strong class="${o.correct?'correct-text':'wrong-text'}">${o.correct?'Right':'Wrong'}: ${esc(o.text)}</strong><p>${esc(o.why)}</p></div>`).join('')}</details>${sourceHTML(q)}`;document.getElementById('next').onclick=next;document.getElementById('finish').onclick=()=>checkpoint(true);}
function next(){const r=active;if(!r||r.chosen===null)return;if(r.batch.length===BATCH){r.checkpoint=true;sync();checkpoint();return;}r.current=createQuestion(r.mode,r);r.chosen=null;sync();renderQuestion();}
function checkpoint(finishing=false){const r=active;if(!r)return;if(!r.total||!r.batch.length){delete saved.sessions[r.mode];sync();home();return;}view='checkpoint';r.checkpoint=true;sync();const missed=r.batch.filter(a=>!a.q.choices[a.choice].correct),groups={};for(const a of missed)(groups[a.q.concept]||=([])).push(a);const ranked=Object.entries(groups).sort((a,b)=>b[1].length-a[1].length),correct=r.batch.length-missed.length;app.innerHTML=`<section class="intro"><h1>${finishing?'Practice reviewed.':'Checkpoint.'}</h1><p class="muted">${esc(modes.find(m=>m.id===r.mode).name)} · continuous practice</p><div class="result-total">${correct} / ${r.batch.length}</div><p>This checkpoint · ${r.correct}/${r.total} correct this session · Best streak ${r.bestStreak}</p><p>${ranked.length?'Weak spot: '+esc(ranked.filter(x=>x[1].length===ranked[0][1].length).map(x=>x[0]).join(', '))+'.':'No misses in this checkpoint. Keep building the habit.'}</p><div class="actions"><button class="primary" id="continue">Keep practicing</button><button class="secondary" id="done">Finish session</button><button class="text-button" id="pause">Pause & modes</button></div></section><section class="review"><h2>${missed.length?'Review the missed calls':'Clean ledger.'}</h2>${ranked.map(([concept,items])=>`<section><h3>${esc(concept)} · ${items.length} missed</h3>${items.map(a=>{const c=a.q.choices[a.choice],right=a.q.choices.find(x=>x.correct);return `<article><strong>${esc(a.q.prompt)}</strong>${statement(a.q)}<p class="wrong-text">Selected: ${esc(c.text)}</p><p>${esc(c.why)}</p><p class="correct-text">Correct: ${esc(right.text)}</p><p>${esc(a.q.explanation)}</p>${sourceHTML(a.q)}</article>`;}).join('')}</section>`).join('')}${!missed.length?'<p class="muted">The next set brings fresh examples. There is no last round.</p>':''}</section>`;document.getElementById('continue').onclick=()=>{r.checkpoint=false;if(r.batch.length===BATCH)r.batch=[];if(r.chosen!==null){r.current=createQuestion(r.mode,r);r.chosen=null;}sync();renderQuestion();};document.getElementById('done').onclick=()=>{delete saved.sessions[r.mode];sync();home();};document.getElementById('pause').onclick=home;focusMain();}
document.addEventListener('keydown',e=>{if(e.repeat||e.altKey||e.ctrlKey||e.metaKey)return;if(e.target.closest('input,textarea,select,summary'))return;if(view==='question'&&active?.chosen===null&&/^[1-4]$/.test(e.key)){e.preventDefault();answer(Number(e.key)-1);}});
readSave();home();

</script>
